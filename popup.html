<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8" />  <title>WebRTC Recorder</title>  <style>    @import url('https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap');    * {      box-sizing: border-box;      margin: 0;      padding: 0;    }    body {      width: 420px;      min-height: 200px;      background: #1e1e1e;      font-family: Roboto, Arial, sans-serif;      font-size: 13px;      color: #e0e0e0;    }    header {      background: #1565c0;      padding: 0 16px;      height: 48px;      display: flex;      align-items: center;      justify-content: space-between;    }    .header-left {      display: flex;      align-items: center;      gap: 10px;    }    .logo {      width: 10px;      height: 10px;      border-radius: 50%;      background: #ea4335;      flex-shrink: 0;    }    header h1 {      font-size: 14px;      font-weight: 500;      color: #ffffff;      letter-spacing: 0.2px;    }    #tab-url {      font-size: 11px;      color: rgba(255,255,255,0.6);    }    .toolbar {      background: #252525;      border-bottom: 1px solid #333333;      padding: 8px 12px;      display: flex;      align-items: center;      gap: 8px;    }    .spacer { flex: 1; }    .btn {      border: none;      border-radius: 2px;      padding: 0 16px;      height: 32px;      cursor: pointer;      font-family: Roboto, Arial, sans-serif;      font-size: 12px;      font-weight: 500;      letter-spacing: 0.5px;      text-transform: uppercase;      background: transparent;      color: #90caf9;      transition: background 0.15s;    }    .btn:hover   { background: rgba(144,202,249,0.1); }    .btn:active  { background: rgba(144,202,249,0.2); }    .btn:disabled {      color: #555555;      background: transparent;      cursor: default;    }    .btn-contained {      background: #1565c0;      color: #ffffff;    }    .btn-contained:hover   { background: #1976d2; }    .btn-contained:active  { background: #0d47a1; }    .btn-contained:disabled {      background: #333333;      color: #555555;    }    .btn-red  { color: #ef9a9a; }    .btn-red:hover    { background: rgba(239,154,154,0.1); }    .btn-red:disabled { color: #555555; background: transparent; }    .btn-green  { color: #a5d6a7; }    .btn-green:hover    { background: rgba(165,214,167,0.1); }    .btn-green:disabled { color: #555555; background: transparent; }    #empty {      text-align: center;      padding: 40px 24px;      color: #757575;    }    #empty .icon {      width: 48px;      height: 48px;      margin: 0 auto 12px;      border-radius: 50%;      background: #1a2a3a;      display: flex;      align-items: center;      justify-content: center;    }    #empty .icon svg {      width: 24px;      height: 24px;      fill: #1565c0;    }    #empty p {      font-size: 13px;      color: #616161;      line-height: 1.6;    }    #stream-list {      padding: 8px;      display: flex;      flex-direction: column;      gap: 6px;    }    .stream-card {      background: #2a2a2a;      border-radius: 2px;      overflow: hidden;      cursor: pointer;      user-select: none;      transition: background 0.15s;    }    .stream-card.unselected        { background: #2a2a2a; }    .stream-card.unselected:hover  { background: #303030; }    .stream-card.selected          { background: #1b2e1b; }    .stream-card.selected:hover    { background: #1f341f; }    .stream-card.recording         { background: #2e1b1b; }    .stream-card.recording:hover   { background: #341f1f; }    .card-header {      padding: 7px 12px;      display: flex;      align-items: center;      gap: 8px;      border-bottom: 1px solid rgba(255,255,255,0.05);    }    .select-indicator {      width: 8px;      height: 8px;      border-radius: 50%;      flex-shrink: 0;      background: #424242;      transition: background 0.15s;    }    .stream-card.selected .select-indicator  { background: #66bb6a; }    .stream-card.recording .select-indicator {      background: #ef5350;      animation: pulse 1.2s ease-in-out infinite;    }    .card-title {      font-size: 12px;      font-weight: 500;      color: #e0e0e0;      flex: 1;      white-space: nowrap;      overflow: hidden;      text-overflow: ellipsis;    }    .stream-card.unselected .card-title { color: #9e9e9e; }    .status-dot {      width: 8px;      height: 8px;      border-radius: 50%;      background: #424242;      flex-shrink: 0;    }    .status-dot.recording {      background: #ef5350;      animation: pulse 1.2s ease-in-out infinite;    }    .status-dot.stopped { background: #66bb6a; }    @keyframes pulse {      0%, 100% { opacity: 1; transform: scale(1); }      50% { opacity: 0.3; transform: scale(0.8); }    }    .card-body {      display: flex;      align-items: center;      gap: 10px;      padding: 8px 12px;    }    .preview-wrap {      width: 106px;      height: 60px;      background: #121212;      flex-shrink: 0;      border-radius: 2px;      overflow: hidden;      position: relative;    }    .preview-wrap img {      width: 100%;      height: 100%;      object-fit: cover;    }    .preview-wrap .no-video {      position: absolute;      inset: 0;      display: flex;      align-items: center;      justify-content: center;      color: #555555;      font-size: 11px;    }    .card-info {      flex: 1;      display: flex;      flex-direction: column;      gap: 4px;    }    .tracks { display: flex; gap: 4px; flex-wrap: wrap; }    .badge {      background: #1a2a3a;      border-radius: 2px;      padding: 1px 6px;      font-size: 10px;      font-weight: 500;      color: #90caf9;      text-transform: uppercase;      letter-spacing: 0.5px;    }    .timer {      font-family: Roboto, monospace;      font-size: 18px;      font-weight: 700;      color: #ef5350;      display: none;      letter-spacing: 1px;    }    .timer.visible { display: block; }    .status-text {      font-size: 11px;      color: #616161;    }    .card-actions {      display: flex;      flex-direction: column;      align-items: center;      gap: 4px;    }    .btn-sm {      height: 28px;      padding: 0 12px;      font-size: 11px;      min-width: 52px;    }    .divider {      width: 1px;      height: 20px;      background: #333333;      margin: 0 2px;    }    footer {      background: #252525;      border-top: 1px solid #333333;      padding: 6px 16px;      display: flex;      align-items: center;      gap: 8px;    }    footer span { font-size: 11px; color: #555555; }    footer .dot {      width: 3px;      height: 3px;      border-radius: 50%;      background: #444444;    }    ::-webkit-scrollbar { width: 8px; }    ::-webkit-scrollbar-track { background: #1e1e1e; }    ::-webkit-scrollbar-thumb {      background: #3a3a3a;      border-radius: 4px;    }    ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }  </style></head><body><header>  <div class="header-left">    <span class="logo"></span>    <h1>WebRTC Stream Recorder</h1>  </div>  <span id="tab-url"></span></header><div class="toolbar">  <button class="btn btn-contained" id="btn-scan">Scan</button>  <div class="divider"></div>  <button class="btn btn-green" id="btn-rec-all"  disabled>Record</button>  <button class="btn btn-red"   id="btn-stop-all" disabled>Stop all</button>  <div class="spacer"></div></div><div id="empty">  <div class="icon">    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">      <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>    </svg>  </div>  <p>Click <strong>Scan</strong> to detect<br>active WebRTC streams on this page.</p></div><div id="stream-list"></div><footer>  <span>VP8</span>  <div class="dot"></div>  <span>WebM</span>  <div class="dot"></div>  <span>No re-encoding</span></footer><script src="popup.js"></script></body></html>
